name: Solo Pool RS
version: "0.6.8"
tagline: Solo-mine Bitcoin over Stratum V1 & V2 — 100% of every block to your address
icon: https://raw.githubusercontent.com/cbyam/umbrel-app-store/main/cbyam-solo-pool-rs/icon.svg
description: >-
  A self-contained solo Bitcoin mining pool for your own ASICs. Point any
  Stratum V1 miner — or a Stratum V2 (Noise-encrypted) device like the
  NerdQAxe++ — at port 3333 and every block found pays out entirely to the
  address you configure. The protocol is auto-detected per connection, so V1
  and V2 hardware share the same port.


  Highlights:

  - Stratum V1 + Noise-encrypted Stratum V2 on a single port (the only solo
  pool app with SV2 support)

  - Loss-proof block submission: every found block's raw hex is archived to
  disk before submitblock, with automatic retries — a flaky node can't cost
  you a block

  - Per-miner vardiff, live dashboard with hashrate history and per-worker
  stats, Prometheus metrics

  - Set or change your payout address any time from the dashboard's Settings
  page — no config editing or SSH

  - Single Rust binary; uses your Umbrel's Bitcoin node over RPC with instant
  ZMQ block notifications


  IMPORTANT — first run: open the app and set your payout address on the
  Settings page (no SSH needed). The pool stays paused, with the dashboard
  reachable, until a valid address for your node's network is saved — every
  block reward goes to that address and nowhere else.
releaseNotes: >-
  v0.6.8 fixes the dashboard on a pool with no miner connected: chain tip,
  reward and network difficulty showed zero until the first miner attached,
  which is what every fresh install looks like. They now come straight from
  the node. v0.6.7 rolls up two releases. 0.6.6 shipped the remediation of a full
  security audit, a found-block archive that resubmits any block whose
  acceptance the pool never saw (a crash mid-submit or a node that was
  down), and a ban policy under which only oversize messages ban; honest
  firmware reconnecting after a restart is never banned. 0.6.7 is the
  dashboard release: a round-effort bar showing work since the last block
  as a share of one expected block, a blocks-found count and last-block card
  that survive restarts, a node-health LED that turns amber when bitcoind
  stops answering, and downtime drawn as a gap on the hashrate chart. Log
  files, when enabled, now keep a bounded number of days. The BIP110/RDTS
  card was removed now that the fork has resolved. A spurious "ZMQ has been
  silent" warning on healthy nodes is fixed.

