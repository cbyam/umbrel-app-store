name: Solo Pool RS
version: "0.6.11"
tagline: Solo-mine Bitcoin over Stratum V1 & V2 — 100% of every block to your address
icon: https://raw.githubusercontent.com/cbyam/umbrel-app-store/main/cbyam-solo-pool-rs/icon.svg
description: >-
  A self-contained solo Bitcoin mining pool for your own ASICs. Point any
  Stratum V1 miner — or a Stratum V2 (Noise-encrypted) device like the
  NerdQAxe++ — at port 3333 and every block found pays out entirely to the
  address you configure. The protocol is auto-detected per connection, so V1
  and V2 hardware share the same port.


  Highlights:

  - Stratum V1 + Noise-encrypted Stratum V2 on a single port (the only solo
  pool app with SV2 support)

  - Loss-proof block submission: every found block's raw hex is archived to
  disk while it is submitted, with automatic retries — a flaky node can't
  cost you a block

  - Per-miner vardiff, live dashboard with hashrate history and per-worker
  stats, Prometheus metrics

  - Set or change your payout address any time from the dashboard's Settings
  page — no config editing or SSH

  - Single Rust binary; uses your Umbrel's Bitcoin node over RPC with instant
  ZMQ block notifications


  IMPORTANT — first run: open the app and set your payout address on the
  Settings page (no SSH needed). The pool stays paused, with the dashboard
  reachable, until a valid address for your node's network is saved — every
  block reward goes to that address and nowhere else.
releaseNotes: >-
  v0.6.11 rolls up three releases. The dashboard now flags a miner that needs
  a look: each worker's rejects are judged over the last hour (stale shares as
  a rate, anything else as a device fault), the Rejects and Workers cards turn
  amber or red and name the miner, and a recovered miner clears on its own. A
  new FAQ, linked from the dashboard's Help link, explains every warning. The
  3h and 24h hashrate columns now survive a miner reconnect and a pool
  restart, and vardiff judges the work a miner's shares proved over a
  trailing window, so difficulty no longer ratchets after a raise and holds
  steadier. The Stratum V2 stack moves to
  the SRI v1.12 crates with the wire format unchanged, and a regtest test now
  mines a real block over Noise-encrypted SV2 in CI. New installs get a wider
  difficulty range (512 to 4,194,304), suiting anything from a USB stick to
  a large Antminer; existing installs keep their settings. Prometheus gains
  per-miner online and last-share series for alerting, and pool-wide series
  no longer expire after a quiet day. The image moves to Debian 13 (trixie).
  rustls is updated for recent advisories; the pool never opens a TLS
  connection through it, so there was no exposure.

