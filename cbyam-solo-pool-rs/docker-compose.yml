# Solo Pool RS on umbrelOS.
#
# Wiring:
#  - Dashboard (container :9090) is served through Umbrel's app_proxy on the
#    manifest port (4333), behind umbrelOS auth.
#  - Stratum is raw TCP and bypasses the proxy: published straight to the host
#    on 3333. Miners connect to <umbrel-ip>:3333 (SV1 and SV2 auto-detected).
#  - Bitcoin node access comes from the Bitcoin app's exported env vars
#    (rpcauth credentials + ZMQ hashblock), injected into the stock config via
#    solo-pool-rs's SOLO_POOL_* env overrides. No cookie mount needed.
#  - The app's data/ dir (copied to ${APP_DATA_DIR}/data on install) holds
#    config.toml — where the user sets coinbase_address — plus the stats DB
#    and found-block archive.
services:
  app_proxy:
    environment:
      APP_HOST: cbyam-solo-pool-rs_pool_1
      APP_PORT: 9090

  pool:
    image: ghcr.io/cbyam/solo-pool-rs:0.4.1@sha256:a25de7d1cf571dde67b13a17a0001432326d4acebd4b80ec65b3f9f0c43ada72
    restart: on-failure
    stop_grace_period: 1m
    # The image's built-in user is 10001, but Umbrel's app-data dirs are owned
    # by umbrel (1000); run as 1000 so the stats DB and block archive are
    # writable. The binary needs no particular uid (RPC auth is user/pass, not
    # the cookie file).
    user: "1000:1000"
    ports:
      - "3333:3333"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    command: ["/app/data/config.toml"]
    environment:
      - SOLO_POOL_BITCOIN_RPC__URL=http://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_RPC_PORT}
      - SOLO_POOL_BITCOIN_RPC__USER=${APP_BITCOIN_RPC_USER}
      - SOLO_POOL_BITCOIN_RPC__PASSWORD=${APP_BITCOIN_RPC_PASS}
      - SOLO_POOL_ZMQ__HASHBLOCK_ENDPOINT=tcp://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_ZMQ_HASHBLOCK_PORT}
